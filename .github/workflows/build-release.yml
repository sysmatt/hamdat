name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: hamdat.exe
            asset_name: hamdat-windows.exe
          - os: macos-latest
            artifact_name: hamdat
            asset_name: hamdat-macos
          - os: ubuntu-latest
            artifact_name: hamdat
            asset_name: hamdat-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build executable
        shell: bash
        run: |
          cp hamdat hamdat.py
          python3 -c "
content = open('hamdat.py').read()
open('hamdat.py','w').write(content.replace('VERSION = \"dev\"', 'VERSION = \"${{ github.ref_name }}\"'))
"
          pyinstaller --onefile --name hamdat hamdat.py

      - name: Rename for release
        shell: bash
        run: mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
